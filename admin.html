<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODOT | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #121212;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #00e5ff;
            --card-border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 5%;
        }

        h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }

        .header { text-align: center; margin-bottom: 3rem; }
        .header h1 { font-size: 2.5rem; color: var(--accent); }
        .header p { color: var(--text-muted); }

        .search-box {
            display: flex; gap: 1rem; margin-bottom: 3rem;
            width: 100%; max-width: 600px;
        }

        input[type="text"] {
            flex-grow: 1; padding: 1rem 1.5rem;
            background: var(--surface-color); border: 1px solid var(--card-border);
            border-radius: 8px; color: var(--text-main); font-size: 1.1rem;
            outline: none; transition: 0.3s;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        button {
            padding: 1rem 2rem; background-color: var(--accent); color: var(--bg-color);
            border: none; border-radius: 8px; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: 0.3s;
        }
        button:hover { box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Results Area */
        #results-container {
            display: none; width: 100%; max-width: 800px;
            background: var(--surface-color); border: 1px solid var(--card-border);
            border-radius: 12px; padding: 2rem;
            animation: fadeIn 0.4s ease-out;
        }

        .status-badge {
            display: inline-block; padding: 0.4rem 1rem; border-radius: 50px;
            font-size: 0.85rem; font-weight: 600; margin-bottom: 1.5rem;
            background: rgba(0, 229, 255, 0.1); color: var(--accent); border: 1px solid var(--accent);
        }

        .data-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;
        }

        .data-block { margin-bottom: 1.5rem; }
        .data-block h3 { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 1px;}
        .data-block p { font-size: 1.1rem; font-weight: 500; }

        /* Color Swatches */
        .color-palette { display: flex; gap: 1rem; }
        .swatch-container { display: flex; flex-direction: column; align-items: center; gap: 0.5rem;}
        .swatch {
            width: 50px; height: 50px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
        }
        .hex-code { font-size: 0.8rem; color: var(--text-muted); font-family: monospace; }

        .download-btn {
            display: inline-block; padding: 0.8rem 1.5rem; background: transparent;
            color: var(--text-main); border: 1px solid var(--card-border);
            border-radius: 8px; text-decoration: none; margin-top: 1rem; transition: 0.3s;
        }
        .download-btn:hover { border-color: var(--text-main); background: rgba(255,255,255,0.05); }

        .error-msg { color: #ff4757; margin-top: 1rem; display: none; font-weight: 600; text-align: center;}

        @media (max-width: 600px) {
            .data-grid { grid-template-columns: 1fr; }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Admin Control Panel</h1>
        <p>Pull client preferences, assets, and project status securely.</p>
    </div>

    <div class="search-box">
        <input type="text" id="adminTicketInput" placeholder="Enter Client Ticket ID (e.g., CO-12345)">
        <button id="searchBtn">Fetch Details</button>
    </div>

    <div class="error-msg" id="errorMsg">Ticket not found or no data available.</div>

    <div id="results-container">
        <div class="status-badge" id="clientStatus">Status: Unknown</div>
        
        <div class="data-grid">
            <div>
                <div class="data-block">
                    <h3>Design Vibe Selected</h3>
                    <p id="clientVibe">Clean & Minimal</p>
                </div>

                <div class="data-block">
                    <h3>Brand Color Palette</h3>
                    <div class="color-palette" id="colorPalette">
                        </div>
                </div>
            </div>

            <div>
                <div class="data-block">
                    <h3>Client Custom Notes</h3>
                    <p id="clientNotes" style="font-size: 0.95rem; color: var(--text-muted); background: rgba(255,255,255,0.02); padding: 1rem; border-radius: 8px;">
                        No notes provided.
                    </p>
                </div>

                <div class="data-block">
                    <h3>Uploaded Brand Assets</h3>
                    <div id="assetContainer">
                        <p style="font-size: 0.9rem; color: var(--text-muted);">No assets uploaded yet.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Same config as your front-end
        const firebaseConfig = {
            apiKey: "AIzaSyD0PjmGveJ_QS4s3S0wFwiDjxdeE4tRKzw",
            authDomain: "codot-agency.firebaseapp.com",
            projectId: "codot-agency",
            storageBucket: "codot-agency.firebasestorage.app",
            messagingSenderId: "22678307444",
            appId: "1:22678307444:web:59c72496bad5db86b3c721"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const searchBtn = document.getElementById('searchBtn');
        const input = document.getElementById('adminTicketInput');
        const resultsContainer = document.getElementById('results-container');
        const errorMsg = document.getElementById('errorMsg');

        // DOM Elements for Data
        const clientStatus = document.getElementById('clientStatus');
        const clientVibe = document.getElementById('clientVibe');
        const colorPalette = document.getElementById('colorPalette');
        const clientNotes = document.getElementById('clientNotes');
        const assetContainer = document.getElementById('assetContainer');

        searchBtn.addEventListener('click', async () => {
            const ticketId = input.value.trim().toUpperCase();
            if(!ticketId) return;

            searchBtn.innerText = "Loading...";
            searchBtn.disabled = true;
            resultsContainer.style.display = "none";
            errorMsg.style.display = "none";

            try {
                const q = query(collection(db, "applications"), where("ticketID", "==", ticketId));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const data = querySnapshot.docs[0].data();
                    
                    // Render Status
                    clientStatus.innerText = `Status: ${data.status || 'Pending'}`;
                    
                    // Render Vibe
                    clientVibe.innerText = data.clientVibePref || 'Not selected yet';
                    
                    // Render Notes
                    clientNotes.innerText = data.clientCustomNotes || 'No extra notes provided by client.';

                    // Render Colors with Swatches
                    colorPalette.innerHTML = '';
                    if (data.colors) {
                        const colors = [
                            { name: 'Primary', hex: data.colors.primary },
                            { name: 'Secondary', hex: data.colors.secondary },
                            { name: 'Background', hex: data.colors.background }
                        ];
                        
                        colors.forEach(c => {
                            if(c.hex) {
                                colorPalette.innerHTML += `
                                    <div class="swatch-container">
                                        <div class="swatch" style="background-color: ${c.hex}"></div>
                                        <span class="hex-code">${c.hex}</span>
                                    </div>
                                `;
                            }
                        });
                    } else {
                        colorPalette.innerHTML = '<p style="font-size: 0.9rem; color: #9ca3af;">Colors not set yet.</p>';
                    }

                    // Render Asset Link
                    if (data.assetDownloadUrl) {
                        assetContainer.innerHTML = `
                            <a href="${data.assetDownloadUrl}" target="_blank" class="download-btn">
                                ⬇️ Download Assets File
                            </a>
                        `;
                    } else {
                        assetContainer.innerHTML = '<p style="font-size: 0.9rem; color: #9ca3af;">No assets uploaded yet.</p>';
                    }

                    resultsContainer.style.display = "block";
                } else {
                    errorMsg.style.display = "block";
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                errorMsg.innerText = "Error connecting to database. Check permissions.";
                errorMsg.style.display = "block";
            }

            searchBtn.innerText = "Fetch Details";
            searchBtn.disabled = false;
        });
    </script>
</body>
</html>
