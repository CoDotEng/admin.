<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODOT | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #121212;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #00e5ff;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            min-height: 100vh; 
            margin: 0;
            padding: 40px 20px;
        }

        .admin-container {
            background: var(--surface-color); 
            padding: 3rem; 
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05); 
            width: 100%; 
            max-width: 700px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { 
            font-family: 'Space Grotesk', sans-serif; 
            color: var(--accent); 
            margin-bottom: 0.5rem; 
            text-align: center; 
            font-size: 2rem;
        }

        h3 {
            font-family: 'Space Grotesk', sans-serif;
            margin-top: 2rem;
            font-size: 1.2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            color: var(--text-main);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group { margin-bottom: 1.5rem; }
        
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            color: var(--text-muted); 
            font-size: 0.8rem; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input, select {
            width: 100%; 
            padding: 1rem; 
            background: var(--bg-color); 
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 6px; 
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%; 
            padding: 1rem; 
            background: var(--accent); 
            color: var(--bg-color);
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif; 
            font-size: 1.1rem;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        button:hover { 
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); 
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent; 
            border: 1px solid var(--accent); 
            color: var(--accent);
        }

        #message { 
            margin-top: 1rem; 
            text-align: center; 
            font-weight: 600; 
            font-size: 0.9rem;
            min-height: 24px;
        }

        /* --- NEW: BIRD'S EYE DASHBOARD GRID --- */
        #allProjectsGrid {
            display: none; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
            animation: fadeIn 0.3s ease;
        }

        .project-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .project-card:hover {
            border-color: var(--accent);
            background: rgba(0, 229, 255, 0.05);
            transform: translateY(-3px);
        }

        .project-card h4 {
            color: var(--accent);
            margin: 0 0 8px 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* --- CLIENT DATA VIEWER STYLES --- */
        .flex-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .flex-row input { margin-bottom: 0; }
        .flex-row button { margin-top: 0; width: 150px; }

        #clientDataDisplay {
            display: none; 
            background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 8px; 
            padding: 20px;
            margin-top: 15px;
            animation: fadeIn 0.3s ease;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .data-item {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .data-label {
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .color-swatch {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            vertical-align: text-bottom;
            margin-right: 6px;
        }

        .btn-download {
            display: block;
            margin-top: 20px;
            padding: 12px;
            background: #ff007f;
            color: white !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            font-family: 'Space Grotesk', sans-serif;
            transition: all 0.3s ease;
        }
        .btn-download:hover { background: #e60073; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 600px) {
            .data-grid { grid-template-columns: 1fr; }
            .flex-row { flex-direction: column; }
            .flex-row button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>CODOT Admin Panel</h2>
        <p class="subtitle">Control center for projects & performance</p>
        
        <!-- === SECTION 1: TICKET UPDATER === -->
        <h3>Ticket Manager (Update Status)</h3>
        <div class="form-group">
            <label>Client Ticket ID</label>
            <input type="text" id="adminTicketID" placeholder="e.g. CO-A1B2C3">
            
            <label>New Project Status</label>
            <select id="newStatus">
                <option value="1. Application Under Review">1. Application Under Review</option>
                <option value="2. Awaiting Preferences & Assets">2. Awaiting Preferences & Assets</option>
                <option value="3. Preferences Received & Planning">3. Preferences Received & Planning</option>
                <option value="4. Design & UI Prototyping">4. Design & UI Prototyping</option>
                <option value="5. Development & Coding">5. Development & Coding</option>
                <option value="6. Final Testing & QA">6. Final Testing & QA</option>
                <option value="7. Live & Deployed">7. Live & Deployed</option>
            </select>
            <button id="updateBtn">Update Ticket Status</button>
            <div id="message"></div>
        </div>

        <!-- === SECTION 2: THE BIRD'S-EYE DASHBOARD === -->
        <h3>Bird's-Eye Dashboard</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">Click any project card to automatically pull its details.</p>
        <div class="form-group">
            <button id="loadAllBtn" class="btn-outline">Load All Active Projects</button>
            <div id="allProjectsGrid">
                <!-- Project cards will be injected here by JS -->
            </div>
        </div>

        <!-- === SECTION 3: CLIENT DATA VIEWER === -->
        <h3 id="dataViewerSection">Client Data Viewer (Fetch Assets)</h3>
        <div class="form-group">
            <label>Pull Preferences & Files</label>
            <div class="flex-row">
                <input type="text" id="viewTicketInput" placeholder="Enter Ticket ID (e.g. CO-XXXXXX)">
                <button id="fetchDetailsBtn" class="btn-outline">Pull Details</button>
            </div>

            <!-- This div reveals the data once fetched -->
            <div id="clientDataDisplay"></div>
        </div>

        <!-- === SECTION 4: PORTFOLIO ADDER === -->
        <h3>Portfolio Management</h3>
        <div class="form-group">
            <label>Add New Portfolio Project</label>
            <input type="text" id="siteName" placeholder="Client Name (e.g. Gravity Res.)">
            <input type="text" id="siteUrl" placeholder="URL (https://...)">
            <button id="addProjectBtn" class="btn-outline">Add to Portfolio</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, updateDoc, doc, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0PjmGveJ_QS4s3S0wFwiDjxdeE4tRKzw",
            authDomain: "codot-agency.firebaseapp.com",
            projectId: "codot-agency",
            storageBucket: "codot-agency.firebasestorage.app",
            messagingSenderId: "22678307444",
            appId: "1:22678307444:web:59c72496bad5db86b3c721"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- LOGIC 1: TICKET UPDATER ---
        document.getElementById('updateBtn').addEventListener('click', async () => {
            const ticketInput = document.getElementById('adminTicketID').value.trim().toUpperCase();
            const newStatus = document.getElementById('newStatus').value;
            const messageDiv = document.getElementById('message');
            
            if(!ticketInput) return alert("Enter a Ticket ID");

            messageDiv.innerText = "Searching...";
            messageDiv.style.color = "var(--text-muted)";

            try {
                const q = query(collection(db, "applications"), where("ticketID", "==", ticketInput));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    messageDiv.innerText = "Ticket not found!";
                    messageDiv.style.color = "var(--error)";
                    return;
                }

                querySnapshot.forEach(async (documentSnapshot) => {
                    await updateDoc(doc(db, "applications", documentSnapshot.id), { status: newStatus });
                    messageDiv.innerText = "✅ Status Updated Successfully!";
                    messageDiv.style.color = "var(--success)";
                    
                    // Auto-refresh the dashboard if it's open so it shows the new status
                    if(document.getElementById('allProjectsGrid').style.display === "grid") {
                        document.getElementById('loadAllBtn').click();
                    }
                });
            } catch (e) {
                messageDiv.innerText = "Error. Check console.";
                console.error(e);
            }
        });

        // --- LOGIC 2: BIRD'S-EYE DASHBOARD ---
        const loadAllBtn = document.getElementById('loadAllBtn');
        const allProjectsGrid = document.getElementById('allProjectsGrid');

        loadAllBtn.addEventListener('click', async () => {
            loadAllBtn.innerText = "Fetching Database...";
            loadAllBtn.disabled = true;

            try {
                const querySnapshot = await getDocs(collection(db, "applications"));
                
                if (querySnapshot.empty) {
                    allProjectsGrid.innerHTML = `<p style="color: var(--text-muted);">No active projects found.</p>`;
                    allProjectsGrid.style.display = "block";
                } else {
                    allProjectsGrid.innerHTML = ""; // Clear out previous load
                    allProjectsGrid.style.display = "grid";

                    querySnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        
                        // Fallbacks just in case a field is empty
                        const ticketID = data.ticketID || "UNKNOWN-ID";
                        const statusRaw = data.status || "1. Application Under Review";
                        const vibe = data.clientVibePref || "Awaiting Setup";
                        
                        // Clean up the status string to just show the text, not the number
                        const cleanStatus = statusRaw.split('. ')[1] || statusRaw;

                        // Create the Card Element
                        const card = document.createElement('div');
                        card.className = "project-card";
                        card.innerHTML = `
                            <h4>${ticketID}</h4>
                            <div class="status-badge">${cleanStatus}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">Vibe: <span style="color: var(--text-main);">${vibe}</span></div>
                        `;

                        // Add the "Click to view details" magic hack
                        card.addEventListener('click', () => {
                            document.getElementById('viewTicketInput').value = ticketID;
                            document.getElementById('fetchDetailsBtn').click();
                            document.getElementById('dataViewerSection').scrollIntoView({ behavior: 'smooth' });
                        });

                        allProjectsGrid.appendChild(card);
                    });
                }
            } catch (error) {
                console.error("Error fetching all projects: ", error);
                alert("Failed to fetch dashboard. Check console.");
            }

            loadAllBtn.innerText = "Refresh All Projects";
            loadAllBtn.disabled = false;
        });

        // --- LOGIC 3: CLIENT DATA VIEWER ---
        const fetchDetailsBtn = document.getElementById('fetchDetailsBtn');
        const viewTicketInput = document.getElementById('viewTicketInput');
        const clientDataDisplay = document.getElementById('clientDataDisplay');

        fetchDetailsBtn.addEventListener('click', async () => {
            const ticketId = viewTicketInput.value.trim().toUpperCase();
            
            if (!ticketId) {
                alert("Please enter a Ticket ID to pull details.");
                return;
            }

            fetchDetailsBtn.innerText = "Pulling...";
            fetchDetailsBtn.disabled = true;

            try {
                const q = query(collection(db, "applications"), where("ticketID", "==", ticketId));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    querySnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        
                        const primary = data.colors?.primary || "N/A";
                        const secondary = data.colors?.secondary || "N/A";
                        const bg = data.colors?.background || "N/A";
                        const vibe = data.clientVibePref || "Not selected yet";
                        const notes = data.clientCustomNotes || "No extra notes provided.";
                        const assetUrl = data.assetDownloadUrl || null;

                        clientDataDisplay.style.display = "block";
                        clientDataDisplay.innerHTML = `
                            <div style="margin-bottom: 15px;">
                                <strong>Ticket:</strong> <span style="color: var(--accent); font-family: 'Space Grotesk', sans-serif;">${data.ticketID}</span>
                            </div>
                            
                            <div class="data-grid">
                                <div class="data-item">
                                    <div class="data-label">Selected Vibe</div>
                                    <div style="font-size: 1.1rem; font-weight: bold; color: var(--text-main);">${vibe}</div>
                                </div>
                                
                                <div class="data-item">
                                    <div class="data-label">Brand Colors</div>
                                    <div style="font-size: 0.9rem; margin-bottom: 4px;">
                                        <span class="color-swatch" style="background-color: ${primary};"></span> Primary: ${primary}
                                    </div>
                                    <div style="font-size: 0.9rem; margin-bottom: 4px;">
                                        <span class="color-swatch" style="background-color: ${secondary};"></span> Secondary: ${secondary}
                                    </div>
                                    <div style="font-size: 0.9rem;">
                                        <span class="color-swatch" style="background-color: ${bg};"></span> Background: ${bg}
                                    </div>
                                </div>
                            </div>

                            <div class="data-item" style="margin-top: 15px;">
                                <div class="data-label">Client Notes & Links</div>
                                <p style="white-space: pre-wrap; font-size: 0.95rem; color: var(--text-main); margin: 0;">${notes}</p>
                            </div>

                            ${assetUrl 
                                ? `<a href="${assetUrl}" target="_blank" class="btn-download">📁 Download Client Brand Assets</a>` 
                                : `<p style="color: var(--error); margin-top: 15px; font-weight: bold; text-align: center;">⚠️ No assets uploaded by client yet.</p>`
                            }
                        `;
                    });
                } else {
                    clientDataDisplay.style.display = "block";
                    clientDataDisplay.innerHTML = `<p style="color: var(--error); text-align: center;">No application found with Ticket ID: ${ticketId}</p>`;
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                alert("Failed to fetch data. Check your connection.");
            }

            fetchDetailsBtn.innerText = "Pull Details";
            fetchDetailsBtn.disabled = false;
        });

        // --- LOGIC 4: PORTFOLIO ADDER ---
        document.getElementById('addProjectBtn').addEventListener('click', async () => {
            const name = document.getElementById('siteName').value.trim();
            const url = document.getElementById('siteUrl').value.trim();
            
            if(!name || !url) return alert("Fill both Name and URL");

            try {
                await addDoc(collection(db, "portfolio"), {
                    name: name,
                    url: url,
                    score: "--",
                    lastUpdated: new Date()
                });
                alert("Project Added to Portfolio!");
                document.getElementById('siteName').value = "";
                document.getElementById('siteUrl').value = "";
            } catch (e) {
                console.error(e);
            }
        });
    </script>
</body>
</html>
