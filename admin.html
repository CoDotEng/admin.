<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODOT | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #121212;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #00e5ff;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            display: flex; 
            justify-content: center; 
            align-items: flex-start; /* Changed to flex-start for scrolling */
            min-height: 100vh; 
            margin: 0;
            padding: 40px 20px;
        }

        .admin-container {
            background: var(--surface-color); 
            padding: 3rem; 
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05); 
            width: 100%; 
            max-width: 500px; /* Slightly wider for the sync UI */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { 
            font-family: 'Space Grotesk', sans-serif; 
            color: var(--accent); 
            margin-bottom: 0.5rem; 
            text-align: center; 
            font-size: 2rem;
        }

        h3 {
            font-family: 'Space Grotesk', sans-serif;
            margin-top: 2rem;
            font-size: 1.2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group { margin-bottom: 1.5rem; }
        
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            color: var(--text-muted); 
            font-size: 0.8rem; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input, select {
            width: 100%; 
            padding: 1rem; 
            background: var(--bg-color); 
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 6px; 
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%; 
            padding: 1rem; 
            background: var(--accent); 
            color: var(--bg-color);
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif; 
            font-size: 1.1rem;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        button:hover { 
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); 
            transform: translateY(-2px);
        }

        .sync-btn {
            background: #ffffff;
            color: #000;
            margin-top: 20px;
        }

        #message, #syncStatus { 
            margin-top: 1.5rem; 
            text-align: center; 
            font-weight: 600; 
            font-size: 0.9rem;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>CODOT Admin Panel</h2>
        <p class="subtitle">Control center for projects & performance</p>
        
        <h3>Ticket Manager</h3>
        <div class="form-group">
            <label>Client Ticket ID</label>
            <input type="text" id="adminTicketID" placeholder="e.g. CO-A1B2C3">
            
            <label>New Project Status</label>
            <select id="newStatus">
                <option value="Application Under Review">1. Application Under Review</option>
                <option value="Preferences Received & Planning">2. Preferences Received & Planning</option>
                <option value="Design & UI Prototyping">3. Design & UI Prototyping</option>
                <option value="Development & Coding">4. Development & Coding</option>
                <option value="Final Testing & QA">5. Final Testing & QA</option>
                <option value="Live & Deployed">6. Live & Deployed</option>
            </select>
            <button id="updateBtn">Update Ticket Status</button>
            <div id="message"></div>
        </div>

        <h3>Portfolio Speed Sync</h3>
        <div class="form-group">
            <label>Add New Portfolio Project</label>
            <input type="text" id="siteName" placeholder="Client Name (e.g. Gravity Res.)">
            <input type="text" id="siteUrl" placeholder="URL (https://...)">
            <button id="addProjectBtn" style="background: transparent; border: 1px solid var(--accent); color: var(--accent);">Add to Portfolio</button>
        </div>

        <button id="syncAllBtn" class="sync-btn">🔄 Sync All Live Scores</button>
        <div id="syncStatus"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, updateDoc, doc, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0PjmGveJ_QS4s3S0wFwiDjxdeE4tRKzw",
            authDomain: "codot-agency.firebaseapp.com",
            projectId: "codot-agency",
            storageBucket: "codot-agency.firebasestorage.app",
            messagingSenderId: "22678307444",
            appId: "1:22678307444:web:59c72496bad5db86b3c721"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- LOGIC 1: TICKET UPDATER ---
        document.getElementById('updateBtn').addEventListener('click', async () => {
            const ticketInput = document.getElementById('adminTicketID').value.trim().toUpperCase();
            const newStatus = document.getElementById('newStatus').value;
            const messageDiv = document.getElementById('message');
            
            if(!ticketInput) return alert("Enter a Ticket ID");

            messageDiv.innerText = "Searching...";
            messageDiv.style.color = "var(--text-muted)";

            try {
                const q = query(collection(db, "applications"), where("ticketID", "==", ticketInput));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    messageDiv.innerText = "Ticket not found!";
                    messageDiv.style.color = "var(--error)";
                    return;
                }

                querySnapshot.forEach(async (documentSnapshot) => {
                    await updateDoc(doc(db, "applications", documentSnapshot.id), { status: newStatus });
                    messageDiv.innerText = "✅ Status Updated Successfully!";
                    messageDiv.style.color = "var(--success)";
                });
            } catch (e) {
                messageDiv.innerText = "Error. Check console.";
                console.error(e);
            }
        });

        // --- LOGIC 2: PORTFOLIO ADDER ---
        document.getElementById('addProjectBtn').addEventListener('click', async () => {
            const name = document.getElementById('siteName').value.trim();
            const url = document.getElementById('siteUrl').value.trim();
            
            if(!name || !url) return alert("Fill both Name and URL");

            try {
                await addDoc(collection(db, "portfolio"), {
                    name: name,
                    url: url,
                    score: "--",
                    lastUpdated: new Date()
                });
                alert("Project Added to Portfolio!");
                document.getElementById('siteName').value = "";
                document.getElementById('siteUrl').value = "";
            } catch (e) {
                console.error(e);
            }
        });

        // --- LOGIC 3: LIVE SPEED SYNC (The "Magic" Part) ---
        document.getElementById('syncAllBtn').addEventListener('click', async () => {
            const statusDiv = document.getElementById('syncStatus');
            const btn = document.getElementById('syncAllBtn');
            
            btn.disabled = true;
            btn.innerText = "Syncing with Google...";
            statusDiv.style.color = "var(--accent)";
            statusDiv.innerText = "Testing performance live (approx 20s per site)...";

            try {
                const querySnapshot = await getDocs(collection(db, "portfolio"));
                
                for (const projectDoc of querySnapshot.docs) {
                    const data = projectDoc.data();
                    statusDiv.innerText = `Testing: ${data.name}...`;

                    // Calling Public PageSpeed API (No Key Required)
                    const apiURL = `https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${encodeURIComponent(data.url)}&category=performance`;
                    const response = await fetch(apiURL);
                    const json = await response.json();
                    
                    const score = Math.round(json.lighthouseResult.categories.performance.score * 100);

                    // Update Firebase with actual live score
                    await updateDoc(doc(db, "portfolio", projectDoc.id), {
                        score: score,
                        lastUpdated: new Date()
                    });
                }

                statusDiv.innerText = "✅ All Scores Synced to Homepage!";
                statusDiv.style.color = "var(--success)";
            } catch (e) {
                statusDiv.innerText = "Error during sync. Check URL formats.";
                statusDiv.style.color = "var(--error)";
                console.error(e);
            }
            btn.disabled = false;
            btn.innerText = "🔄 Sync All Live Scores";
        });
    </script>
</body>
</html>
