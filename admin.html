<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODOT | Master Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #121212;
            --surface-light: #1a1a1a;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #00e5ff;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --border: rgba(255,255,255,0.08);
        }

        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 40px 20px; display: flex; justify-content: center; min-height: 100vh;
        }

        .admin-wrapper {
            width: 100%; max-width: 1000px;
        }

        .header { text-align: center; margin-bottom: 3rem; }
        .header h1 { font-family: 'Space Grotesk', sans-serif; color: var(--accent); font-size: 2.5rem; margin: 0 0 0.5rem 0; }
        .header p { color: var(--text-muted); margin: 0; }

        .dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .dashboard-header h2 { font-family: 'Space Grotesk', sans-serif; margin: 0; font-size: 1.5rem; }
        
        .btn-action {
            background: rgba(0, 229, 255, 0.1); color: var(--accent); border: 1px solid var(--accent);
            padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.3s;
            font-family: 'Space Grotesk', sans-serif;
        }
        .btn-action:hover { background: var(--accent); color: var(--bg-color); box-shadow: 0 0 15px rgba(0,229,255,0.3); }

        /* --- QUICK TICKET UPDATER --- */
        .quick-updater {
            background: rgba(0, 229, 255, 0.03); border: 1px solid var(--accent); border-radius: 8px; padding: 1.5rem;
            margin-bottom: 3rem; display: flex; gap: 1rem; align-items: flex-end;
        }
        .quick-updater .form-group { margin-bottom: 0; flex: 1; }
        #quickUpdateMsg { width: 100%; text-align: right; font-size: 0.85rem; font-weight: 600; margin-top: 0.5rem; height: 20px; }

        /* --- DASHBOARD CARDS --- */
        #projectsGrid {
            display: none; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 3rem;
            animation: fadeIn 0.4s ease;
        }

        .client-card {
            background: var(--surface-color); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem;
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        .client-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
        .client-name { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; margin: 0; color: var(--text-main); }
        .ticket-id { font-size: 0.75rem; color: var(--accent); background: rgba(0,229,255,0.1); padding: 2px 8px; border-radius: 12px; }
        .client-email { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; display: block; }
        
        .status-pill { display: inline-block; font-size: 0.75rem; padding: 4px 10px; border-radius: 4px; background: rgba(255,255,255,0.1); font-weight: 600; }

        /* --- EDITOR SECTION --- */
        #editorWrapper { display: none; animation: fadeIn 0.4s ease; }
        
        .editor-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }

        .editor-panel { background: var(--surface-color); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
        .editor-panel h3 { font-family: 'Space Grotesk', sans-serif; color: var(--accent); margin: 0 0 1.5rem 0; font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 600; }
        input, select, textarea {
            width: 100%; padding: 0.8rem; background: var(--bg-color); color: var(--text-main);
            border: 1px solid var(--border); border-radius: 4px; font-family: 'Inter', sans-serif;
            transition: border-color 0.2s; box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
        textarea { resize: vertical; min-height: 80px; }

        .flex-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
        
        .btn-save {
            width: 100%; padding: 1.2rem; background: var(--success); color: #fff; font-size: 1.1rem;
            font-family: 'Space Grotesk', sans-serif; font-weight: bold; border: none; border-radius: 8px;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-save:hover { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); transform: translateY(-2px); }

        .email-link { display: inline-block; margin-top: 0.5rem; font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 600; }
        .email-link:hover { text-decoration: underline; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) { 
            .editor-layout { grid-template-columns: 1fr; } 
            .quick-updater { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <div class="header">
            <h1>CODOT Command Center</h1>
            <p>Manage clients, update statuses, and access project data efficiently.</p>
        </div>

        <div class="dashboard-header">
            <h2>Fast Status Update</h2>
        </div>
        <div class="quick-updater">
            <div class="form-group">
                <label>Ticket ID</label>
                <input type="text" id="quickTicketID" placeholder="e.g. CO-A1B2C3" style="border-color: var(--accent);">
            </div>
            <div class="form-group">
                <label>New Phase</label>
                <select id="quickStatus">
                    <option value="1. Application Under Review">1. Application Under Review</option>
                    <option value="2. Awaiting Preferences & Assets">2. Awaiting Preferences & Assets</option>
                    <option value="3. Preferences Received & Planning">3. Preferences Received & Planning</option>
                    <option value="4. Design & UI Prototyping">4. Design & UI Prototyping</option>
                    <option value="5. Development & Coding">5. Development & Coding</option>
                    <option value="6. Final Testing & QA">6. Final Testing & QA</option>
                    <option value="7. Live & Deployed">7. Live & Deployed</option>
                </select>
            </div>
            <button id="quickUpdateBtn" class="btn-save" style="width: auto; padding: 0.8rem 2rem; margin-top: 0;">Update Ticket</button>
        </div>
        <div id="quickUpdateMsg"></div>

        <div class="dashboard-header">
            <h2>Active Client Roster</h2>
            <button id="loadBtn" class="btn-action">Sync Database</button>
        </div>
        
        <div id="projectsGrid">
            </div>

        <div id="editorWrapper">
            <div class="dashboard-header" style="margin-top: 2rem;">
                <h2 id="editorTitle">Editing Client: <span style="color: var(--accent)">Select a project</span></h2>
                <span id="editorTicket" class="ticket-id" style="font-size: 1rem;">--</span>
            </div>

            <div class="editor-layout">
                <div class="editor-panel">
                    <h3>Client Identity & Status</h3>
                    <div class="form-group">
                        <label>Client Name</label>
                        <input type="text" id="eName" placeholder="Client Name">
                    </div>
                    <div class="form-group">
                        <label>Client Email</label>
                        <input type="email" id="eEmail" placeholder="client@email.com">
                        <a href="#" id="eEmailLink" class="email-link">📧 Send Email</a>
                    </div>
                    <div class="form-group" style="margin-top: 2rem;">
                        <label>Current Phase (Status)</label>
                        <select id="eStatus">
                            <option value="1. Application Under Review">1. Application Under Review</option>
                            <option value="2. Awaiting Preferences & Assets">2. Awaiting Preferences & Assets</option>
                            <option value="3. Preferences Received & Planning">3. Preferences Received & Planning</option>
                            <option value="4. Design & UI Prototyping">4. Design & UI Prototyping</option>
                            <option value="5. Development & Coding">5. Development & Coding</option>
                            <option value="6. Final Testing & QA">6. Final Testing & QA</option>
                            <option value="7. Live & Deployed">7. Live & Deployed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Project Display Name</label>
                        <input type="text" id="eProjectName" placeholder="e.g. Gravity Research Landing">
                    </div>
                    <div class="form-group">
                        <label>Estimated Delivery Date</label>
                        <input type="text" id="eDate" placeholder="e.g. Nov 14, 2026">
                    </div>
                </div>

                <div class="editor-panel">
                    <h3>Brand & Design Assets</h3>
                    <div class="form-group">
                        <label>Design Vibe Preference</label>
                        <input type="text" id="eVibe" placeholder="e.g. Minimalist, Dark Mode">
                    </div>
                    <div class="form-group">
                        <label>Brand Colors (Hex)</label>
                        <div class="flex-inputs">
                            <input type="text" id="eColorPri" placeholder="Primary">
                            <input type="text" id="eColorSec" placeholder="Secondary">
                            <input type="text" id="eColorBg" placeholder="Background">
                        </div>
                    </div>
                    <div class="form-group" style="margin-top: 2rem;">
                        <label>Drive / Asset URL</label>
                        <input type="text" id="eAssetUrl" placeholder="https://drive.google.com/...">
                        <a href="#" id="eAssetLink" class="email-link" target="_blank" style="display:none; color: var(--warning);">📁 Open Client Assets</a>
                    </div>
                    <div class="form-group">
                        <label>Internal Admin Notes</label>
                        <textarea id="eNotes" placeholder="Any special requests or details..."></textarea>
                    </div>
                </div>
            </div>

            <button id="saveBtn" class="btn-save">💾 Save All Client Changes</button>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, updateDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0PjmGveJ_QS4s3S0wFwiDjxdeE4tRKzw",
            authDomain: "codot-agency.firebaseapp.com",
            projectId: "codot-agency",
            storageBucket: "codot-agency.firebasestorage.app",
            messagingSenderId: "22678307444",
            appId: "1:22678307444:web:59c72496bad5db86b3c721"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentDocId = null;

        const loadBtn = document.getElementById('loadBtn');
        const grid = document.getElementById('projectsGrid');
        const editor = document.getElementById('editorWrapper');
        const quickMsg = document.getElementById('quickUpdateMsg');

        // --- QUICK TICKET UPDATER LOGIC ---
        document.getElementById('quickUpdateBtn').addEventListener('click', async () => {
            const ticketInput = document.getElementById('quickTicketID').value.trim().toUpperCase();
            const newStatus = document.getElementById('quickStatus').value;
            
            if(!ticketInput) {
                quickMsg.innerText = "Please enter a Ticket ID.";
                quickMsg.style.color = "var(--error)";
                return;
            }

            quickMsg.innerText = "Searching database...";
            quickMsg.style.color = "var(--text-muted)";

            try {
                const q = query(collection(db, "applications"), where("ticketID", "==", ticketInput));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    quickMsg.innerText = "❌ Ticket not found!";
                    quickMsg.style.color = "var(--error)";
                    return;
                }

                querySnapshot.forEach(async (documentSnapshot) => {
                    await updateDoc(doc(db, "applications", documentSnapshot.id), { status: newStatus });
                    quickMsg.innerText = "✅ Status Updated Successfully!";
                    quickMsg.style.color = "var(--success)";
                    
                    // Clear the input and auto-refresh the grid
                    document.getElementById('quickTicketID').value = '';
                    loadBtn.click();
                    
                    // Clear message after 3 seconds
                    setTimeout(() => { quickMsg.innerText = ""; }, 3000);
                });
            } catch (e) {
                quickMsg.innerText = "Error. Check console.";
                quickMsg.style.color = "var(--error)";
                console.error(e);
            }
        });

        // --- LOAD ROSTER ---
        loadBtn.addEventListener('click', async () => {
            loadBtn.innerText = "Syncing...";
            grid.style.display = "none";
            grid.innerHTML = "";

            try {
                const snapshot = await getDocs(collection(db, "applications"));
                
                if (snapshot.empty) {
                    grid.innerHTML = `<p style="color: var(--text-muted);">No clients found in database.</p>`;
                } else {
                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        const id = docSnap.id;
                        
                        const name = data.clientName || "Unnamed Client";
                        const email = data.clientEmail || "No Email Provided";
                        const ticket = data.ticketID || "NO-TICKET";
                        const statusRaw = data.status || "1. Application Under Review";
                        const cleanStatus = statusRaw.split('. ')[1] || statusRaw;
                        const projName = data.projectName || "Pending Setup";

                        const card = document.createElement('div');
                        card.className = "client-card";
                        card.innerHTML = `
                            <div class="card-top">
                                <h3 class="client-name">${name}</h3>
                                <span class="ticket-id">${ticket}</span>
                            </div>
                            <span class="client-email">${email}</span>
                            <div style="margin-bottom: 10px; font-size: 0.85rem; color: var(--text-muted);">Project: <span style="color: var(--text-main);">${projName}</span></div>
                            <div class="status-pill">${cleanStatus}</div>
                        `;

                        card.addEventListener('click', () => loadEditor(id, data));
                        grid.appendChild(card);
                    });
                }
                grid.style.display = "grid";
            } catch (error) {
                console.error("Fetch Error:", error);
                alert("Failed to sync database.");
            }
            loadBtn.innerText = "Sync Database";
        });

        // --- POPULATE EDITOR ---
        function loadEditor(docId, data) {
            currentDocId = docId;
            
            document.getElementById('editorTitle').innerHTML = `Editing: <span style="color: var(--accent)">${data.clientName || 'Unnamed Client'}</span>`;
            document.getElementById('editorTicket').innerText = data.ticketID || "NO-TICKET";

            document.getElementById('eName').value = data.clientName || "";
            document.getElementById('eEmail').value = data.clientEmail || "";
            document.getElementById('eStatus').value = data.status || "1. Application Under Review";
            document.getElementById('eProjectName').value = data.projectName || "";
            document.getElementById('eDate').value = data.estDelivery || "";
            document.getElementById('eVibe').value = data.clientVibePref || "";
            document.getElementById('eColorPri').value = data.colors?.primary || "";
            document.getElementById('eColorSec').value = data.colors?.secondary || "";
            document.getElementById('eColorBg').value = data.colors?.background || "";
            document.getElementById('eAssetUrl').value = data.assetDownloadUrl || "";
            document.getElementById('eNotes').value = data.clientCustomNotes || "";

            const emailLink = document.getElementById('eEmailLink');
            if(data.clientEmail) {
                emailLink.href = `mailto:${data.clientEmail}`;
                emailLink.style.display = "inline-block";
            } else { emailLink.style.display = "none"; }

            const assetLink = document.getElementById('eAssetLink');
            if(data.assetDownloadUrl) {
                assetLink.href = data.assetDownloadUrl;
                assetLink.style.display = "inline-block";
            } else { assetLink.style.display = "none"; }

            editor.style.display = "block";
            editor.scrollIntoView({ behavior: 'smooth' });
        }

        // --- SAVE DATA ---
        document.getElementById('saveBtn').addEventListener('click', async () => {
            if (!currentDocId) return;
            const btn = document.getElementById('saveBtn');
            btn.innerText = "Saving Data...";
            btn.style.opacity = "0.7";

            try {
                await updateDoc(doc(db, "applications", currentDocId), {
                    clientName: document.getElementById('eName').value,
                    clientEmail: document.getElementById('eEmail').value,
                    status: document.getElementById('eStatus').value,
                    projectName: document.getElementById('eProjectName').value,
                    estDelivery: document.getElementById('eDate').value,
                    clientVibePref: document.getElementById('eVibe').value,
                    colors: {
                        primary: document.getElementById('eColorPri').value,
                        secondary: document.getElementById('eColorSec').value,
                        background: document.getElementById('eColorBg').value
                    },
                    assetDownloadUrl: document.getElementById('eAssetUrl').value,
                    clientCustomNotes: document.getElementById('eNotes').value
                });

                btn.innerText = "✅ Saved Successfully!";
                setTimeout(() => { btn.innerText = "💾 Save All Client Changes"; btn.style.opacity = "1"; }, 2000);
                
                loadBtn.click();
            } catch (err) {
                console.error(err);
                alert("Failed to save. Check permissions.");
                btn.innerText = "💾 Save All Client Changes";
                btn.style.opacity = "1";
            }
        });

        // Load grid automatically on page open
        window.onload = () => loadBtn.click();
    </script>
</body>
</html>
