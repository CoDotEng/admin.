<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODOT | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #121212;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #00e5ff;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
        }

        .admin-container {
            background: var(--surface-color); 
            padding: 3rem; 
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05); 
            width: 100%; 
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { 
            font-family: 'Space Grotesk', sans-serif; 
            color: var(--accent); 
            margin-bottom: 0.5rem; 
            text-align: center; 
            font-size: 2rem;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group { margin-bottom: 1.5rem; }
        
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            color: var(--text-muted); 
            font-size: 0.9rem; 
            font-weight: 600;
        }
        
        input, select {
            width: 100%; 
            padding: 1rem; 
            background: var(--bg-color); 
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 6px; 
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%; 
            padding: 1rem; 
            background: var(--accent); 
            color: var(--bg-color);
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif; 
            font-size: 1.1rem;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        button:hover { 
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); 
            transform: translateY(-2px);
        }

        #message { 
            margin-top: 1.5rem; 
            text-align: center; 
            font-weight: 600; 
            font-size: 0.95rem;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>Ticket Manager</h2>
        <p class="subtitle">Update client project status</p>
        
        <div class="form-group">
            <label for="adminTicketID">Client Ticket ID</label>
            <input type="text" id="adminTicketID" placeholder="e.g. CO-A1B2C3" required>
        </div>

        <div class="form-group">
            <label for="newStatus">New Project Status</label>
            <select id="newStatus">
                <option value="Application Under Review">1. Application Under Review</option>
                <option value="Preferences Received & Planning">2. Preferences Received & Planning</option>
                <option value="Design & UI Prototyping">3. Design & UI Prototyping</option>
                <option value="Development & Coding">4. Development & Coding</option>
                <option value="Final Testing & QA">5. Final Testing & QA</option>
                <option value="Live & Deployed">6. Live & Deployed</option>
            </select>
        </div>

        <button id="updateBtn">Update Status</button>
        <div id="message"></div>
    </div>

    <!-- FIREBASE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD0PjmGveJ_QS4s3S0wFwiDjxdeE4tRKzw",
            authDomain: "codot-agency.firebaseapp.com",
            projectId: "codot-agency",
            storageBucket: "codot-agency.firebasestorage.app",
            messagingSenderId: "22678307444",
            appId: "1:22678307444:web:59c72496bad5db86b3c721"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Update Logic
        document.getElementById('updateBtn').addEventListener('click', async () => {
            const ticketInput = document.getElementById('adminTicketID').value.trim().toUpperCase();
            const newStatus = document.getElementById('newStatus').value;
            const messageDiv = document.getElementById('message');
            const btn = document.getElementById('updateBtn');

            if(!ticketInput) {
                messageDiv.innerText = "Please enter a Ticket ID.";
                messageDiv.style.color = "var(--error)";
                return;
            }

            btn.innerText = "Updating...";
            messageDiv.innerText = "Searching database...";
            messageDiv.style.color = "var(--text-muted)";

            try {
                // Find the document with this Ticket ID
                const q = query(collection(db, "applications"), where("ticketID", "==", ticketInput));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    messageDiv.innerText = `Ticket ${ticketInput} not found!`;
                    messageDiv.style.color = "var(--error)";
                    btn.innerText = "Update Status";
                    return;
                }

                // Update the document (handles case if multiple docs have same ID, though unlikely)
                querySnapshot.forEach(async (documentSnapshot) => {
                    const docRef = doc(db, "applications", documentSnapshot.id);
                    await updateDoc(docRef, {
                        status: newStatus
                    });
                    messageDiv.innerText = `Success! Status updated to: ${newStatus}`;
                    messageDiv.style.color = "var(--success)";
                    btn.innerText = "Update Status";
                    document.getElementById('adminTicketID').value = ''; // Clear input on success
                });

            } catch (error) {
                console.error("Error updating ticket: ", error);
                messageDiv.innerText = "Error updating ticket. Check console.";
                messageDiv.style.color = "var(--error)";
                btn.innerText = "Update Status";
            }
        });
    </script>
</body>
</html>
