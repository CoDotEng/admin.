<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODOT | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #121212;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #00e5ff;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            min-height: 100vh; 
            margin: 0;
            padding: 40px 20px;
        }

        .admin-container {
            background: var(--surface-color); 
            padding: 3rem; 
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05); 
            width: 100%; 
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { 
            font-family: 'Space Grotesk', sans-serif; 
            color: var(--accent); 
            margin-bottom: 0.5rem; 
            text-align: center; 
            font-size: 2rem;
        }

        h3 {
            font-family: 'Space Grotesk', sans-serif;
            margin-top: 2.5rem;
            font-size: 1.2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            color: var(--text-main);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group { margin-bottom: 1.5rem; }
        
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            color: var(--text-muted); 
            font-size: 0.8rem; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input, select, textarea {
            width: 100%; 
            padding: 1rem; 
            background: var(--bg-color); 
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 6px; 
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        textarea { resize: vertical; min-height: 100px; }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%; 
            padding: 1rem; 
            background: var(--accent); 
            color: var(--bg-color);
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif; 
            font-size: 1.1rem;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        button:hover { 
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); 
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent; 
            border: 1px solid var(--accent); 
            color: var(--accent);
        }
        
        .btn-save {
            background: var(--success);
            color: #fff;
            margin-top: 15px;
        }

        .btn-save:hover {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); 
        }

        #message { 
            margin-top: 1rem; 
            text-align: center; 
            font-weight: 600; 
            font-size: 0.9rem;
            min-height: 24px;
        }

        /* --- DASHBOARD GRID --- */
        #allProjectsGrid {
            display: none; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
            animation: fadeIn 0.3s ease;
        }

        .project-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .project-card:hover {
            border-color: var(--accent);
            background: rgba(0, 229, 255, 0.05);
            transform: translateY(-3px);
        }

        .project-card h4 {
            color: var(--accent);
            margin: 0 0 8px 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* --- MASTER EDITOR --- */
        .flex-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .flex-row input { margin-bottom: 0; }
        .flex-row button { margin-top: 0; width: 150px; }

        #editorSection {
            display: none; 
            background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 8px; 
            padding: 20px;
            margin-top: 15px;
            animation: fadeIn 0.3s ease;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .asset-link {
            display: inline-block;
            margin-top: 10px;
            color: var(--accent);
            font-weight: bold;
            font-size: 0.9rem;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
            .flex-row { flex-direction: column; }
            .flex-row button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>CODOT Admin Panel</h2>
        <p class="subtitle">Control center for projects & performance</p>
        
        <h3>Active Projects Dashboard</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">Click any project card to pull it into the editor.</p>
        <div class="form-group">
            <button id="loadAllBtn" class="btn-outline">Load All Active Projects</button>
            <div id="allProjectsGrid">
                </div>
        </div>

        <h3 id="dataViewerSection">Master Project Editor</h3>
        <div class="form-group">
            <label>Fetch Client Ticket</label>
            <div class="flex-row">
                <input type="text" id="viewTicketInput" placeholder="Enter Ticket ID (e.g. CO-XXXXXX)">
                <button id="fetchDetailsBtn" class="btn-outline">Pull Details</button>
            </div>
            <div id="fetchMessage" style="text-align: center; font-size: 0.9rem; margin-top: 10px;"></div>

            <div id="editorSection">
                <div class="grid-2">
                    <div>
                        <label>Ticket ID (Read-Only)</label>
                        <input type="text" id="editTicketID" readonly style="color: var(--accent); border-color: var(--accent); background: rgba(0,229,255,0.05);">
                    </div>
                    <div>
                        <label>Project Status</label>
                        <select id="editStatus">
                            <option value="1. Application Under Review">1. Application Under Review</option>
                            <option value="2. Awaiting Preferences & Assets">2. Awaiting Preferences & Assets</option>
                            <option value="3. Preferences Received & Planning">3. Preferences Received & Planning</option>
                            <option value="4. Design & UI Prototyping">4. Design & UI Prototyping</option>
                            <option value="5. Development & Coding">5. Development & Coding</option>
                            <option value="6. Final Testing & QA">6. Final Testing & QA</option>
                            <option value="7. Live & Deployed">7. Live & Deployed</option>
                        </select>
                    </div>
                    <div>
                        <label>Project Name (For Dashboard)</label>
                        <input type="text" id="editProjectName" placeholder="e.g. Custom Landing Page">
                    </div>
                    <div>
                        <label>Est. Delivery Date</label>
                        <input type="text" id="editEstDelivery" placeholder="e.g. Nov 14, 2026">
                    </div>
                    <div>
                        <label>Client Vibe Preference</label>
                        <input type="text" id="editVibe" placeholder="e.g. Dark, Neon, Minimalist">
                    </div>
                    <div>
                        <label>Primary Color (Hex)</label>
                        <input type="text" id="editPrimary" placeholder="#00e5ff">
                    </div>
                    <div>
                        <label>Secondary Color (Hex)</label>
                        <input type="text" id="editSecondary" placeholder="#ffffff">
                    </div>
                    <div>
                        <label>Background Color (Hex)</label>
                        <input type="text" id="editBackground" placeholder="#050505">
                    </div>
                </div>

                <label style="margin-top: 15px;">Asset Download URL</label>
                <input type="text" id="editAssetUrl" placeholder="https://drive.google.com/...">
                <a id="currentAssetLink" class="asset-link" href="#" target="_blank" style="display: none;">📁 Open Current Assets</a>

                <label style="margin-top: 15px;">Client Notes / Extras</label>
                <textarea id="editNotes" placeholder="Client notes go here..."></textarea>

                <button id="saveChangesBtn" class="btn-save">Save All Changes to Database</button>
            </div>
        </div>

        <h3>Portfolio Management</h3>
        <div class="form-group">
            <label>Add New Portfolio Project</label>
            <input type="text" id="siteName" placeholder="Client Name (e.g. Gravity Res.)">
            <input type="text" id="siteUrl" placeholder="URL (https://...)">
            <button id="addProjectBtn" class="btn-outline">Add to Portfolio</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, updateDoc, doc, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0PjmGveJ_QS4s3S0wFwiDjxdeE4tRKzw",
            authDomain: "codot-agency.firebaseapp.com",
            projectId: "codot-agency",
            storageBucket: "codot-agency.firebasestorage.app",
            messagingSenderId: "22678307444",
            appId: "1:22678307444:web:59c72496bad5db86b3c721"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global variable to track which document we are currently editing
        let currentEditingDocId = null; 

        // --- LOGIC 1: BIRD'S-EYE DASHBOARD ---
        const loadAllBtn = document.getElementById('loadAllBtn');
        const allProjectsGrid = document.getElementById('allProjectsGrid');

        loadAllBtn.addEventListener('click', async () => {
            loadAllBtn.innerText = "Fetching Database...";
            loadAllBtn.disabled = true;

            try {
                const querySnapshot = await getDocs(collection(db, "applications"));
                
                if (querySnapshot.empty) {
                    allProjectsGrid.innerHTML = `<p style="color: var(--text-muted);">No active projects found.</p>`;
                    allProjectsGrid.style.display = "block";
                } else {
                    allProjectsGrid.innerHTML = ""; 
                    allProjectsGrid.style.display = "grid";

                    querySnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        
                        const ticketID = data.ticketID || "UNKNOWN-ID";
                        const statusRaw = data.status || "1. Application Under Review";
                        const projectName = data.projectName || "Pending Setup";
                        const cleanStatus = statusRaw.split('. ')[1] || statusRaw;

                        const card = document.createElement('div');
                        card.className = "project-card";
                        card.innerHTML = `
                            <h4>${ticketID}</h4>
                            <div class="status-badge">${cleanStatus}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">Project: <span style="color: var(--text-main);">${projectName}</span></div>
                        `;

                        // Magic Hack: Click card to load into editor
                        card.addEventListener('click', () => {
                            document.getElementById('viewTicketInput').value = ticketID;
                            document.getElementById('fetchDetailsBtn').click();
                            document.getElementById('dataViewerSection').scrollIntoView({ behavior: 'smooth' });
                        });

                        allProjectsGrid.appendChild(card);
                    });
                }
            } catch (error) {
                console.error("Error fetching all projects: ", error);
                alert("Failed to fetch dashboard. Check console.");
            }

            loadAllBtn.innerText = "Refresh All Projects";
            loadAllBtn.disabled = false;
        });

        // --- LOGIC 2: MASTER FETCH & POPULATE EDITOR ---
        const fetchDetailsBtn = document.getElementById('fetchDetailsBtn');
        const viewTicketInput = document.getElementById('viewTicketInput');
        const editorSection = document.getElementById('editorSection');
        const fetchMessage = document.getElementById('fetchMessage');

        fetchDetailsBtn.addEventListener('click', async () => {
            const ticketId = viewTicketInput.value.trim().toUpperCase();
            
            if (!ticketId) {
                alert("Please enter a Ticket ID to pull details.");
                return;
            }

            fetchMessage.innerText = "Pulling data...";
            fetchMessage.style.color = "var(--text-muted)";
            editorSection.style.display = "none";
            currentEditingDocId = null;

            try {
                const q = query(collection(db, "applications"), where("ticketID", "==", ticketId));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    querySnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        currentEditingDocId = docSnap.id; // Save the unique Firestore ID for updating later
                        
                        // Populate form fields
                        document.getElementById('editTicketID').value = data.ticketID || "";
                        document.getElementById('editStatus').value = data.status || "1. Application Under Review";
                        document.getElementById('editProjectName').value = data.projectName || "";
                        document.getElementById('editEstDelivery').value = data.estDelivery || "";
                        document.getElementById('editVibe').value = data.clientVibePref || "";
                        document.getElementById('editPrimary').value = data.colors?.primary || "";
                        document.getElementById('editSecondary').value = data.colors?.secondary || "";
                        document.getElementById('editBackground').value = data.colors?.background || "";
                        document.getElementById('editNotes').value = data.clientCustomNotes || "";
                        document.getElementById('editAssetUrl').value = data.assetDownloadUrl || "";

                        // Handle Asset Link visibility
                        const assetLink = document.getElementById('currentAssetLink');
                        if(data.assetDownloadUrl) {
                            assetLink.href = data.assetDownloadUrl;
                            assetLink.style.display = "inline-block";
                        } else {
                            assetLink.style.display = "none";
                        }

                        editorSection.style.display = "block";
                        fetchMessage.innerText = "✅ Client data loaded successfully.";
                        fetchMessage.style.color = "var(--success)";
                    });
                } else {
                    fetchMessage.innerText = `❌ No application found with Ticket ID: ${ticketId}`;
                    fetchMessage.style.color = "var(--error)";
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                fetchMessage.innerText = "Error fetching data. Check your connection.";
                fetchMessage.style.color = "var(--error)";
            }
        });

        // --- LOGIC 3: SAVE CHANGES TO FIRESTORE ---
        document.getElementById('saveChangesBtn').addEventListener('click', async () => {
            if (!currentEditingDocId) return alert("No active document loaded!");

            const saveBtn = document.getElementById('saveChangesBtn');
            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            try {
                // Construct the updated data object
                const updatedData = {
                    status: document.getElementById('editStatus').value,
                    projectName: document.getElementById('editProjectName').value,
                    estDelivery: document.getElementById('editEstDelivery').value,
                    clientVibePref: document.getElementById('editVibe').value,
                    colors: {
                        primary: document.getElementById('editPrimary').value,
                        secondary: document.getElementById('editSecondary').value,
                        background: document.getElementById('editBackground').value
                    },
                    clientCustomNotes: document.getElementById('editNotes').value,
                    assetDownloadUrl: document.getElementById('editAssetUrl').value
                };

                // Update the document in Firestore
                await updateDoc(doc(db, "applications", currentEditingDocId), updatedData);
                
                saveBtn.innerText = "✅ Saved Successfully!";
                saveBtn.style.background = "#10b981";

                // Refresh the bird's eye grid if it's open
                if(document.getElementById('allProjectsGrid').style.display === "grid") {
                    document.getElementById('loadAllBtn').click();
                }

                // Reset button text after 2 seconds
                setTimeout(() => {
                    saveBtn.innerText = "Save All Changes to Database";
                }, 2000);

            } catch (error) {
                console.error("Error updating document: ", error);
                alert("Failed to save changes. Check console.");
                saveBtn.innerText = "Save All Changes to Database";
            }
            
            saveBtn.disabled = false;
        });

        // --- LOGIC 4: PORTFOLIO ADDER ---
        document.getElementById('addProjectBtn').addEventListener('click', async () => {
            const name = document.getElementById('siteName').value.trim();
            const url = document.getElementById('siteUrl').value.trim();
            
            if(!name || !url) return alert("Fill both Name and URL");

            try {
                await addDoc(collection(db, "portfolio"), {
                    name: name,
                    url: url,
                    score: "--",
                    lastUpdated: new Date()
                });
                alert("Project Added to Portfolio!");
                document.getElementById('siteName').value = "";
                document.getElementById('siteUrl').value = "";
            } catch (e) {
                console.error(e);
            }
        });
    </script>
</body>
</html>
